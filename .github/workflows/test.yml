name: Run Tests
on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ahmadsaid/docker-react -f Dockerfile.dev .
      - name: Run tests
        run: docker run -e CI=true ahmadsaid/docker-react npm run test