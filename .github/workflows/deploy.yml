name: Deploy Frontend
on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ahmadsaid/docker-react -f Dockerfile.dev .
      - name: Run tests
        run: docker run -e CI=true ahmadsaid/docker-react npm run test
      # - run: docker run ahmadsaid/docker-react npm run test -- --coverage
      
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: ahmadsaidnouh/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: frontend
          environment_name: Frontend-env
          existing_bucket_name: elasticbeanstalk-eu-north-1-773703661816
          region: eu-north-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip